[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
minversion = 6.0
addopts =
    -v
    --strict-markers
    --tb=short
markers =
    unit: Fast, isolated unit tests
    integration: Integration tests (multiple components)
    slow: Long-running tests
    external: Tests requiring external services (typically mocked)
    memory: Memory-related tests
    performance: Performance characteristic tests
    asyncio: Mark test as async
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
asyncio_mode = auto

[coverage:run]
# Omit __init__.py files to avoid path-resolution ambiguity in SonarQube.
omit = **/__init__.py
