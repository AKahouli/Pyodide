syntax = "proto3";

package playbook_flow;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service PlaybookFlowRuntime {
  rpc Run(RunRequest) returns (stream RunEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc ResumeApproval(ResumeApprovalRequest) returns (ResumeApprovalResponse);
  rpc ResumeFromStep(ResumeFromStepRequest) returns (ResumeFromStepResponse);
  rpc RunFromCheckpoint(RunFromCheckpointRequest) returns (stream RunEvent);
  rpc ValidateAndRepairPlan(ValidateAndRepairPlanRequest) returns (ValidateAndRepairPlanResponse);
}

message RunRequest {
  string execution_id = 1;
  string flow_id = 2;
  string owner_id = 3;
  FlowSnapshot snapshot = 4;
  google.protobuf.Struct input_context = 5;
  RunSettings settings = 6;
  repeated SeededTaskOutput seeded_task_outputs = 7;
}

message SeededTaskOutput {
  string node_id = 1;
  int32 iteration = 2;
  google.protobuf.Struct payload = 3;
}

message RunSettings {
  int32 recursion_limit = 1;
  int32 max_parallelism = 2;
  DynamicReasoningPolicy dynamic_reasoning_policy = 3;
  PlannerAgentSnapshot playbook_planner = 4;
  RuntimeSettings runtime_settings = 5;
}

message RuntimeSettings {
  int32 max_concurrent_per_user = 1;
  int32 execution_queue_max_depth = 2;
  int32 max_parallelism_per_execution = 3;
  int32 recursion_limit_default = 4;
  int32 recursion_limit_max = 5;
  int32 max_hitl_rounds = 6;
  int32 python_worker_pool_size = 7;
  int32 python_worker_max_inflight = 8;
  int32 max_tool_iterations = 9;
  bool graph_cache_enabled = 10;
  int32 graph_cache_max_entries = 11;
  int32 graph_cache_ttl_seconds = 12;
  int32 max_sandbox_calls_per_step = 13;
}

message DynamicReasoningPolicy {
  int32 max_work_nodes = 1;
  int32 max_parallelism = 2;
  int32 max_depth = 3;
  int32 max_repair_attempts = 4;
}

message PlannerAgentSnapshot {
  string agent_id = 1;
  string agent_type_slug = 2;
  string model = 3;
  string system_prompt = 4;
  double temperature = 5;
  bool omit_temperature = 6;
  string prompt_hash = 7;
  string agent_revision = 8;
}

message DynamicReasoningNodeConfig {
  bool enabled = 1;
}

message FlowSnapshot {
  repeated FlowNode nodes = 1;
  repeated ControlEdge control_edges = 2;
  repeated DataBinding data_bindings = 3;
  FlowSettings settings = 4;
}

message FlowSettings {
  int32 recursion_limit = 1;
  int32 max_parallelism = 2;
}

message FlowNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  string task_template_id = 4;
  string prompt_template_id = 5;
  string output_format_id = 6;
  FlowNodeInput input = 7;
  FlowNodeOutput output = 8;
  RouterConfig router_config = 9;
  IteratorConfig iterator_config = 10;
  HumanApprovalConfig human_approval_config = 11;
  RetryPolicy retry_policy = 12;
  string model_id = 13;
  google.protobuf.Struct metadata = 14;
  DynamicReasoningNodeConfig dynamic_reasoning = 15;
}

message ValidationIssue {
  string code = 1;
  string severity = 2;
  string path = 3;
  string message = 4;
  repeated string related_node_ids = 5;
  google.protobuf.Value expected = 6;
  google.protobuf.Value actual = 7;
  string repair_hint = 8;
}

message ValidateAndRepairPlanRequest {
  string use_case = 1;
  google.protobuf.Struct parent_task = 2;
  google.protobuf.Struct resolved_port_catalog = 3;
  google.protobuf.Struct plan = 4;
  DynamicReasoningPolicy policy = 5;
  bool allow_repair = 6;
  PlannerAgentSnapshot planner = 7;
}

message ValidateAndRepairPlanResponse {
  bool valid = 1;
  google.protobuf.Struct accepted_plan = 2;
  repeated ValidationIssue validation_issues = 3;
  bool repaired = 4;
}

message FlowNodePort {
  string id = 1;
  string label = 2;
  string type = 3;
  bool required = 4;
}

message FlowNodeInput {
  string raw = 1;
  repeated FlowNodePort ports = 2;
}

message FlowNodeOutput {
  string raw = 1;
  repeated FlowNodePort ports = 2;
}

message RouterConfig {
  repeated string output_labels = 1;
  int32 max_iterations = 2;
  repeated RouterCondition conditions = 3;
  string default_label = 4;
}

message RouterCondition {
  string label = 1;
  string source_node = 2;
  string source_port = 3;
  string path = 4;
  string operator = 5;
  google.protobuf.Value value = 6;
}

message IteratorConfig {
  string collection_path = 1;
  int32 max_items = 2;
}

message HumanApprovalConfig {
  string prompt_template = 1;
  int32 timeout_seconds = 2;
}

message RetryPolicy {
  int32 max_retries = 1;
  int32 delay_ms = 2;
}

message ControlEdge {
  string id = 1;
  string kind = 2;
  string source = 3;
  string target = 4;
  string router_label = 5;
  int32 priority = 6;
  string source_output_port_id = 7;
  string target_input_port_id = 8;
}

message DataBinding {
  string id = 1;
  string target_node = 2;
  string target_port = 3;
  string source_kind = 4;
  string source_node = 5;
  string source_port = 6;
  string iteration = 7;
  string trigger_path = 8;
  string state_path = 9;
  google.protobuf.Value constant_value = 10;
  string expression = 11;
}

message RunEvent {
  string event_type = 1;
  string execution_id = 2;
  string node_id = 3;
  int32 iteration = 4;
  google.protobuf.Struct payload = 5;
  google.protobuf.Timestamp timestamp = 6;
}

message CancelRequest {
  string execution_id = 1;
}

message CancelResponse {
  bool cancelled = 1;
}

message ResumeApprovalRequest {
  string execution_id = 1;
  string decision = 2;
  google.protobuf.Struct payload = 3;
}

message ResumeApprovalResponse {
  bool resumed = 1;
}

message ResumeFromStepRequest {
  string execution_id = 1;
  string node_id = 2;
  int32 iteration = 3;
  string interrupt_id = 4;
  string action = 5;
  google.protobuf.Struct payload = 6;
}

message ResumeFromStepResponse {
  bool resumed = 1;
}

message RunFromCheckpointRequest {
  string execution_id = 1;
  string source_execution_id = 2;
  string flow_id = 3;
  string owner_id = 4;
  FlowSnapshot snapshot = 5;
  google.protobuf.Struct input_context = 6;
  RunSettings settings = 7;
  string target_node_id = 8;
  int32 target_iteration = 9;
}
