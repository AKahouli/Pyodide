    user: "1000:1000"
    command: ""
    entrypoint: bash -c "celery -A worker.celery_app worker --loglevel=info -P eventlet -Q metachatbot-api-default -c 5 -n metachatbot-api-default@%h"
    env_file:
      - .env
    volumes:
      - celery-data:/tmp/shared
  celery-worker-data-processing:
    restart: always
    image: yscrmetachatbot001.azurecr.io/codex-vectorstore-api:1.0.2
    user: "1000:1000"
    command: ""
    entrypoint: bash -c "celery -A worker.celery_app worker --loglevel=info -P eventlet -Q data-processing.batch -c 1 -n data-processing.batch@%h"
    env_file:
      - .env
    volumes:
      - celery-data:/tmp/shared
  celery-worker-conformity:
    restart: always
    image: yscrmetachatbot001.azurecr.io/codex-vectorstore-api:1.0.2
    user: "1000:1000"
    command: ""
