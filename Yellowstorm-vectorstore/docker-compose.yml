  celery-worker-conversion:
    restart: always
    image: yscrmetachatbot001.azurecr.io/codex-vectorstore-api:1.0.2
    user: "1000:1000"
    command: ""
    entrypoint: bash -c "celery -A worker.celery_app worker --loglevel=info -P eventlet -Q conversion -c 2 -n conversion@%h"
    env_file:
      - .env
    volumes:
      - celery-data:/tmp/shared

volumes:
  celery-data:
