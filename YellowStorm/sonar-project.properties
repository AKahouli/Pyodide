# ============================================
# SonarCloud Configuration for Whitelabel-codex
# ============================================
sonar.organization=yellowsysorg-1
sonar.projectKey=YellowsysOrg_YellowStorm

# All available modules
sonar.modules=front,back

# ============================================
# Frontend Module (Node.js - React.js)
# ============================================
front.sonar.projectName=front
front.sonar.projectBaseDir=front
front.sonar.sources=src
front.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
front.sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
front.sonar.coverage.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
front.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ============================================
# Backend Module (Node.js)
# ============================================
back.sonar.projectName=back
back.sonar.projectBaseDir=back
back.sonar.sources=src
back.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# ============================================
# Global Settings
# ============================================
sonar.sourceEncoding=UTF-8
 