syntax = "proto3";

package chatbot;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ===== COMMON MESSAGES =====

message ImageData {
    string filepath = 1;
    string createdAt = 2;
}

message DocumentData {
    // === Identity & Location ===
    string filepath = 1;                 // Path in Azure Data Lake (e.g., "workspaceId/docId.pdf")
    string filename = 2;                 // Display name (e.g., "report_q4.pdf")
    string workspace_name = 3;           // Stored workspace name used in search metadata
    string workspace_id = 4;                 // Brain/workspace this file belongs to
    string source = 5;                   // Source reference (defaults to filepath if empty)
    string createdAt = 6;                // creation date
    // === Indexing Configuration ===
    string brain_type = 7;               // "doc" (vector search) or "graph" (knowledge graph)
    string lang_code = 8;                // Language code (ISO 639-1: "en", "fr", "auto")
    int32 chunk_size = 9;                // Max characters per chunk (default: 4000)
    int32 chunk_overlap = 10;            // Overlap between consecutive chunks (default: 100)
    bool enable_smart_chunk = 11;        // Style-aware chunking respecting headings/paragraphs
    bool enable_extract_images = 12;     // Extract and index images from PDF via YOLO pipeline
    string sheet_name = 13;              // Sheet name filter for Excel files (optional)
    bool in_memory = 14;                 // Whether to cache document in memory
}

message AttachedFile {
    string type = 1;                     // "image" or "document"
    oneof data {
        ImageData image = 2;             // Set when type = "image"
        DocumentData document = 3;       // Set when type = "document"
    }
}

message Chatbot {
    string model = 1;  // Full LiteLLM model identifier (e.g., "anthropic/claude-sonnet-4-5", "azure/gpt-4.1")
    repeated string input_modalities = 2; // Supported request inputs: "text", optionally "image"
    string reasoning_effort = 3; // Optional model-supported effort identifier
    int32 context_window_tokens = 4; // Authoritative selected-model input capacity when known
    Compaction compaction = 5; // ADK context-compaction config for this request (omitted = disabled)
}

// ADK context compaction config. Both trigger pairs are optional; token_threshold
// is derived server-side as token_fraction * context_window_tokens.
message Compaction {
    bool enabled = 1;               // Master switch; when false the runner builds no compaction config
    int32 compaction_interval = 2;  // Sliding window: new invocations between compactions (0 = off)
    int32 overlap_size = 3;         // Sliding window: prior invocations re-summarized for continuity
    float token_fraction = 4;       // Token trigger: threshold = token_fraction * context window, 0..1 (0 = off)
    int32 event_retention_size = 5; // Token trigger: recent raw events kept un-compacted
    string summarizer_model = 6;    // LiteLLM model used to summarize; empty = fall back to the chat model
}

message Tool {
    string name = 1;
    string prompt = 2;
    string description = 3;
    int32 top_k = 4;
    string accessToken = 5;
    string guidelines = 6;
}

message AgentParams {
    map<string, string> params = 1;
}

message SkillFile {
    string path = 1;
    string kind = 2;
    string mime_type = 3;
    string content = 4;
}

message Skill {
    string id = 1;
    string name = 2;
    string description = 3;
    string instructions = 4;
    string license = 5;
    string compatibility = 6;
    map<string, string> metadata = 7;
    repeated string allowed_tools = 8;
    repeated SkillFile files = 9;
}

message Document {
    // === Required Core Fields ===
    string _id = 1;                      // Unique document identifier (MongoDB ObjectId)
                                         // Used for: Document lookup, deduplication, search

    string filename = 2;                 // Display name (e.g., "marketing_finance.xlsx")
                                         // Used for: Display, search results, agent context

    // === Storage & Access Fields ===
    string filepath = 3;                 // Full file path (e.g., "workspaceId/documentId.xlsx")
                                         // Used for: File retrieval, storage access

    bool in_memory = 4;                  // Whether document is cached in memory
                                         // Used for: Performance optimization

    // === Metadata Fields ===
    string language = 5;                 // Detected language (ISO 639-1: "en", "fr", "es")
                                         // Used for: Language filtering, multilingual search
                                         // Client maps: detected_language → language

    int32 indexing_token = 6;            // Tokens used for indexing
                                         // Used for: Cost tracking, metrics

    string workspace_id = 7;             // Workspace ID this document belongs to
                                         // Used for: Multi-workspace isolation, access control

    string createdAt = 8;                // creation date
    string file_name = 9;                // Stored file name used in search metadata
    string workspace_name = 10;          // Workspace name used in search metadata
}

message WorkspaceContext {
    string workspace_id = 1;
    repeated Document workspace_documents = 2;
    int32 chunks = 3;
    bool hybrid_search = 4;
    string instruction = 5;
    string tag = 6;
    string workspace_name = 7;           // Stored workspace name used in search metadata
}

// ===== AGENT SUGGESTION MESSAGE =====

message Agent {
    string id = 1;
    string name = 2;
    string description = 3;
    string prompt = 4;
    repeated Tool tools = 5;
    repeated WorkspaceContext brain_context = 6;
    Chatbot chatbot = 7;
    AgentParams agent_params = 8;
    string agent_type = 9;
    bool save_memory = 10;
    repeated Skill skills = 11;
}

// ===== V2 REQUEST MESSAGES =====

message UserContext {
    string user_id = 1;
    string username = 2;
}

message ConnectorRepo {
    string connector_id = 1;
    string connector_name = 2;
    string repo_id = 3;
    string repo_name = 4;
    string repo_url = 5;
}

message CorrectionReplayFinding {
    string claim = 1;
    string status = 2;
    string importance = 3;
    string explanation = 4;
}

message CorrectionReplayContext {
    string original_answer = 1;
    repeated CorrectionReplayFinding findings = 2;
    int32 attempt_number = 3;
    string instructions = 4;
}

// End-to-end latency trace context sent by the backend on conversation turns.
message LatencyTraceContext {
    uint32 schema_version = 1;
    string request_id = 2;
    string assistant_message_id = 3;
    double backend_received_epoch_ms = 4;
}

message AgentTeamNode {
    string agent_id = 1;
    string parent_agent_id = 2;
    int32 order = 3;
}

message AgentTeamDefinition {
    string team_id = 1;
    repeated AgentTeamNode nodes = 2;
}

message RunAgentTeamRequest {
    UserContext user_context = 1;
    string conversation_id = 2;
    string query = 3;
    repeated Agent agents = 6;
    repeated WorkspaceContext workspace_context = 8;
    string agent_mode = 9;
    repeated AttachedFile attached_files = 10;                   // Files attached in this turn (images + documents)
    repeated Document previous_attached_files = 11;  // Already-indexed files from previous turns
    ConnectorRepo connector_repo = 12;
    bool deep_search_enabled = 13;
    repeated Skill skills = 14;
    string task_summary = 15;                              // Human-readable task UI summary; query remains model input
    CorrectionReplayContext correction_replay_context = 16;
    bool web_search_enabled = 17;
    LatencyTraceContext latency_trace_context = 20;
    AgentTeamDefinition team_definition = 21;
}

// Mono-agent request: a single specialized agent runs directly with its own
// tools (no manager / no delegation). Mirrors RunAgentTeamRequest but carries
// exactly one Agent and no agent_mode.
message RunSingleAgentRequest {
    UserContext user_context = 1;
    string conversation_id = 2;
    string query = 3;
    Agent agent = 4;                                 // The single agent to run
    repeated WorkspaceContext workspace_context = 5;
    repeated AttachedFile attached_files = 6;         // Files attached in this turn (images + documents)
    repeated Document previous_attached_files = 7;    // Already-indexed files from previous turns
    ConnectorRepo connector_repo = 8;
    repeated Skill skills = 9;                        // Conversation-level skills selected by the user
    bool deep_search_enabled = 10;                    // When true, enables deep search mode for this request
    string task_summary = 11;                         // Human-readable task UI summary; query remains model input
    CorrectionReplayContext correction_replay_context = 12;
    bool web_search_enabled = 13;
    LatencyTraceContext latency_trace_context = 20;
}

message GenerateConversationNameRequest {
    string query = 1;
    string model = 2;
}

message GenerateConversationNameResponse {
    string conversation_name = 1;
}

// ===== RESPONSE MESSAGES =====

// Component type definitions
message TextComponent {
    string content = 1;          // Text/Markdown content
    string output_port_id = 2;   // Optional target playbook output port
}

message CodeComponent {
    string content = 1;          // The code itself
    string language = 2;         // e.g., "typescript", "python"
    string filename = 3;         // Optional filename
    string output_port_id = 4;   // Optional target playbook output port
}

message AgentActivityComponent {
    string summary = 1;          // Compact progress summary
    optional string detail = 2;  // Full reasoning text for authenticated conversation viewers
    string status = 3;           // running | completed
    optional string started_at = 4;
    optional string completed_at = 5;
    optional int64 duration_ms = 6;
    optional string actor_id = 7;
    optional string actor_name = 8;
}

// Task status enum
enum TaskStatus {
    PENDING = 0;                 // Task not started yet (default)
    IN_PROGRESS = 1;             // Task currently being executed
    COMPLETED = 2;               // Task successfully completed
    ERROR = 3;                   // Task failed with error
}

message PlanStep {
    string task = 1;             // Task description
    string agent = 2;            // Agent assigned to this task
    TaskStatus status = 3;       // Task status (pending by default)
}

message PlanComponent {
    string title = 1;            // Plan title
    repeated PlanStep steps = 2; // Plan steps with agent assignments
    TaskStatus status = 3;       // Overall plan status
}

message TaskItem {
    string text = 1;             // Task item text
}

message TaskComponent {
    string title = 1;            // Task title
    repeated TaskItem items = 2; // List of task items
    string status = 3;           // "pending", "in_progress", or "completed"
}

message QueueItem {
    string id = 1;               // Item ID
    string title = 2;            // Item title
    string status = 3;           // "pending", "active", or "completed"
}

message QueueComponent {
    string title = 1;            // Queue title
    repeated QueueItem items = 2; // List of queue items
}

message CheckpointComponent {
    string label = 1;            // Checkpoint label
}

message ToolActivityComponent {
    string tool_name = 1;        // Stable machine identity
    string status = 2;           // running | completed | failed | stopped
    optional string params_json = 3; // Sanitized JSON tool-call arguments
    optional string result_json = 4; // Bounded structured tool result for trusted backend consumers
    optional string started_at = 5; // RFC 3339 UTC instant captured when the tool call starts
    optional string completed_at = 6;
    optional int64 duration_ms = 7;
    optional string display_key = 8;
    optional string fallback_display_name = 9;
    optional string summary = 10;
    optional string render_kind = 11;
    optional string actor_id = 12;
    optional string actor_name = 13;
    optional string primary_input = 14; // Sanitized first-class display payload, e.g. run_code source
    optional string primary_input_language = 15;
}

enum ChartKind {
    CHART_KIND_UNSPECIFIED = 0;
    CHART_KIND_BAR = 1;
    CHART_KIND_LINE = 2;
    CHART_KIND_AREA = 3;
    CHART_KIND_PIE = 4;
    CHART_KIND_SCATTER = 5;
    CHART_KIND_COMPOSED = 6;
}

enum ChartLayout {
    CHART_LAYOUT_UNSPECIFIED = 0;
    CHART_LAYOUT_HORIZONTAL = 1;
    CHART_LAYOUT_VERTICAL = 2;
}

message ChartComponent {
    string title = 1;            // Optional chart title
    string data = 2;             // JSON string of data array
    string config = 3;           // JSON string of ChartConfig
    string xAxisKey = 4;         // Key for X-axis
    string series = 5;           // JSON string of series array
    ChartKind kind = 6;          // Chart kind. Defaults to BAR when unspecified.
    string yAxisKey = 7;         // Optional explicit Y-axis key
    bool stacked = 8;            // Stack compatible chart series
    ChartLayout layout = 9;      // Chart layout orientation
    int32 inner_radius = 10;     // Donut inner radius for pie charts
    bool show_legend = 11;       // Whether the legend should be shown
    bool show_grid = 12;         // Whether cartesian grid should be shown
    string nameKey = 13;         // Label/name key for pie-like charts
    string zAxisKey = 14;        // Optional Z axis key for scatter charts
}

message ErrorComponent {
    string title = 1;            // Error title
    string content = 2;          // Error message/content
}

message SourceItem {
    string title = 1;            // Source title (e.g., "Wikipedia.org")
    string url = 2;              // Source URL
}

message SourcesComponent {
    repeated SourceItem sources = 1;  // List of web sources
}

message SandboxComponent {
    string code = 1;             // Python code being executed
    string output = 2;           // stdout from execution
    string error = 3;            // stderr from execution
    bool output_available = 4;   // true when output/error is sent (function_response)
}

message WebPreviewComponent {
    string content = 1;          // HTML/CSS/JS content to preview
}

message ArtifactComponent {
    string file_path = 1;        // Trusted internal storage path; never public component data
    string filename = 2;         // Name of the generated file
    string output_port_id = 3;   // Optional target playbook output port
    string artifact_kind = 4;    // Optional artifact kind override
    string mime_type = 5;        // Optional file MIME type
    string artifact_id = 6;      // Opaque browser-safe identity
    optional string producer_tool_id = 7;
    optional int64 size_bytes = 8;
    string availability = 9;     // pending | ready | failed
}

message TextSourceData {
    string type = 1;             // "text"
    string source = 2;           // Filename (e.g., "report.pdf")
    string file_name = 3;        // Source filename this text chunk originates from
    string page = 4;             // Page info (e.g., "report.pdf - page 5")
    string page_content = 5;     // The actual text content
    string workspace_id = 6;     // Workspace ID
    string reference = 7;        // Citation reference (e.g., "[1]", "[2]")
    string highlight_text = 8;   // Exact text to highlight in the source document
    repeated double highlight_bbox = 9; // Highlight bounding box [x, y, width, height]
    repeated double block_bbox = 10;    // Fallback block bounding box [x, y, width, height]
}

message ImageSourceData {
    string type = 1;             // "image"
    string path = 2;             // Image path
    string page = 3;             // Page number or info
    string file_name = 4;        // Source filename
    string workspace_name = 5;   // Workspace name this image belongs to
    string workspace_id = 6;     // Workspace ID
    string height = 7;           // Image height
    string width = 8;            // Image width
    string reference = 9;        // Citation reference (e.g., "[1]", "[2]")
    string highlight_text = 10;  // Exact text to highlight in the source document
    repeated double highlight_bbox = 11; // Highlight bounding box [x, y, width, height]
    repeated double block_bbox = 12;     // Fallback block bounding box [x, y, width, height]
}

message WebSourceData {
    string type = 1;
    string source = 2;
    string title = 3;
    string reference = 4;
    string exact_text = 5;
    string prefix = 6;
    string suffix = 7;
    string evidence_origin = 8;
}

message CitationComponent {
    string parent_id = 1;        // ID of the parent text component
    oneof source_data {
        TextSourceData text_source = 2;
        ImageSourceData image_source = 3;
        WebSourceData web_source = 4;
    }
}

message ChoiceOption {
    string id = 1;
    string label = 2;
    string submit_text = 3;
    string value = 4;
    string description = 5;
    bool disabled = 6;
    string url = 7;
}

message ChoiceOtherOption {
    bool enabled = 1;
    string label = 2;
    string placeholder = 3;
    int32 max_length = 4;
}

message ChoiceLabels {
    string submit = 1;
    string dismiss = 2;
    string other = 3;
}

message ChoiceProgress {
    int32 current = 1;
    int32 total = 2;
    string label = 3;
}

message ChoiceComponent {
    int32 schema_version = 1;
    string question_id = 2;
    string prompt = 3;
    string description = 4;
    string presentation = 5;
    string selection_mode = 6;
    string submit_behavior = 7;
    repeated ChoiceOption options = 8;
    ChoiceOtherOption other_option = 9;
    ChoiceLabels labels = 10;
    ChoiceProgress progress = 11;
    bool dismissible = 12;
    string fallback_text = 13;
    string status = 14;
}

// Main Component message using oneof for type safety
message Component {
    string id = 1;               // Component unique identifier
    reserved 17;
    reserved "chain_of_thought";
    oneof data {
        TextComponent text = 2;
        CodeComponent code = 3;
        AgentActivityComponent agent_activity = 4;
        PlanComponent plan = 5;
        QueueComponent queue = 6;
        CheckpointComponent checkpoint = 7;
        ChartComponent chart = 8;
        TaskComponent task = 9;
        ErrorComponent error = 10;
        SourcesComponent sources = 11;  // Web sources
        SandboxComponent sandbox = 12;  // Python execution sandbox
        WebPreviewComponent web_preview = 13;  // HTML/CSS/JS web preview
        ArtifactComponent artifact = 14;  // Generated file artifact
        CitationComponent citation = 15;  // Document citation reference
        ToolActivityComponent tool_activity = 16; // Tool execution status (running/completed/failed)
        ChoiceComponent choice = 18;
    }
}

message Metadata {
    string message_id = 1;       // Message/session ID
    string agent_id = 2;         // Agent ID
    string guardrail_decision_json = 3;  // JSON guardrail decision metadata for persistence
}

message Usage {
    int32 input_tokens = 1;      // Input tokens sent to LLM
    int32 output_tokens = 2;     // Output tokens generated by LLM
    int32 total_tokens = 3;      // Total tokens (input + output)
    string model = 4;            // Model/chatbot name used (e.g., "gpt-4.1")
    int32 context_window_tokens = 5; // Capacity associated with this individual model request
}

// ADK-local timing envelope attached to the first post-model StreamChunk.
// Epoch fields cross process boundaries; the *_ms durations are computed
// inside ADK from a monotonic clock and are authoritative.
message LatencyTrace {
    uint32 schema_version = 1;
    string request_id = 2;
    string assistant_message_id = 3;

    double adk_request_received_epoch_ms = 4;
    double llm_request_start_epoch_ms = 5;
    double llm_first_delta_epoch_ms = 6;
    double adk_first_delta_forwarded_epoch_ms = 7;

    double adk_pre_provider_ms = 8;
    double provider_ttft_ms = 9;
    double adk_forwarding_ms = 10;

    // Diagnostic children of adk_pre_provider_ms (ADK-local monotonic clock).
    AdkPreProviderBreakdown adk_pre_provider_breakdown = 11;
}

// Diagnostic breakdown of adk_pre_provider_ms. The parent remains
// independently derived; absent stages stay 0 on the wire (proto3 doubles).
message AdkPreProviderBreakdown {
    double protobuf_to_dict_ms = 1;
    double request_logging_ms = 2;
    double request_conversion_ms = 3;
    double workflow_dispatch_ms = 4;
    double session_lock_wait_ms = 5;
    double orchestration_setup_ms = 6;
    double agent_tool_preparation_ms = 7;
    double session_runner_setup_ms = 8;
    double adk_runtime_pre_model_ms = 9;

    // Diagnostic children of session_runner_setup_ms (ADK-local monotonic clock).
    SessionRunnerSetupBreakdown session_runner_setup_breakdown = 10;
}

// Diagnostic breakdown of the ADK session/runner preparation stage.
message SessionRunnerSetupBreakdown {
    double session_service_init_ms = 1;
    double session_lookup_ms = 2;
    double session_create_seed_ms = 3;
    double runner_construction_ms = 4;
    double runner_handoff_ms = 5;
}

message StreamChunk {
    string action = 1;           // "add", "update", "delete", or component-free "heartbeat"
    Component component = 2;     // The component data (optional if only sending usage)
    Metadata metadata = 3;       // Metadata about the chunk
    Usage usage = 4;             // Token usage data (optional)
    LatencyTrace latency_trace = 5; // One-time timing envelope on the first post-model chunk
}

enum ConversationHistoryRole {
    CONVERSATION_HISTORY_ROLE_UNSPECIFIED = 0;
    CONVERSATION_HISTORY_ROLE_USER = 1;
    CONVERSATION_HISTORY_ROLE_ASSISTANT = 2;
}

message ConversationHistoryEntry {
    ConversationHistoryRole role = 1;
    string text = 2;
}

message SeedConversationSessionRequest {
    string user_id = 1;
    string session_id = 2;
    string idempotency_key = 3;
    repeated ConversationHistoryEntry history = 4;
}

message SeedConversationSessionResponse {
    string session_id = 1;
    bool created = 2;
}

message DeleteConversationSessionRequest {
    string user_id = 1;
    string session_id = 2;
    string idempotency_key = 3;
}

message DeleteConversationSessionResponse {
    bool deleted = 1;
}

// ===== SERVICES =====

service ChatbotService {
    rpc RunAgentTeam(RunAgentTeamRequest) returns (stream StreamChunk);
    rpc RunSingleAgent(RunSingleAgentRequest) returns (stream StreamChunk);
    rpc GenerateConversationName(GenerateConversationNameRequest) returns (GenerateConversationNameResponse);
    rpc EvaluateSemanticMatch(EvaluateSemanticMatchRequest) returns (EvaluateSemanticMatchResponse);
    rpc GeneratePlaybook(GeneratePlaybookRequest) returns (GeneratePlaybookResponse);
    rpc EvaluateTask(TaskAdvisorRequest) returns (TaskAdvisorResult);
    rpc AdvisePlaybookNode(AdvisePlaybookNodeRequest) returns (AdvisePlaybookNodeResponse);
    rpc SeedConversationSession(SeedConversationSessionRequest) returns (SeedConversationSessionResponse);
    rpc DeleteConversationSession(DeleteConversationSessionRequest) returns (DeleteConversationSessionResponse);
}

// ===== PLAYBOOK LANGGRAPH SERVICE =====

message MCPToolConfig {
    string name = 1;
    string transport = 2;           // "streamable_http" | "sse"
    string url = 3;
    string api_key = 4;
    map<string, string> headers = 5;
}

message PortDocumentBinding {
    string port_id = 1;           // The input port ID this document is bound to
    repeated string file_names = 2;   // File names bound to this port
}

message PlaybookTaskConfig {
    string id = 1;
    string title = 2;
    string description = 3;
    string assigned_agent_id = 4;
    string execution_mode = 19;
    string selected_action = 20;
    int32 execution_order = 5;
    bool interrupt_before = 6;      // Pause for approval before execution
    bool interrupt_after = 7;       // Pause for review after execution
    bool allow_clarification = 8;   // Enable agent-initiated clarification
    string clarification_prompt = 9;
    int32 max_clarifications = 10;
    repeated string input_keys = 11;
    string output_key = 12;
    repeated string file_names = 13;   // List of file names to restrict search to (legacy flat list)
    repeated TaskInputPort input_ports = 14;
    repeated TaskOutputPort output_ports = 15;
    string task_type = 16;
    repeated PortDocumentBinding input_files_by_port = 17;  // Port-aware document bindings
    repeated ToolBinding tool_bindings = 18;
    google.protobuf.Struct task_metadata = 21;
    google.protobuf.Struct evaluation_config = 22;
}

message ToolBindingAction {
    string action_key = 1;
    string label = 2;
    string description = 3;
    google.protobuf.Struct parameter_schema = 4;
    string parameter_schema_json = 5;
    string result_kind = 6;
    string citation_mode = 7;
    string result_mapping_json = 8;
}

message ToolBinding {
    string id = 1;
    string connector_id = 2;
    repeated ToolBindingAction actions = 3;
    string credential_id = 4;
    map<string, string> fixed_params = 5;
    bool disable_auto_skills = 6;
    string connector_name = 7;
    string mcp_transport_type = 8;
    string mcp_server_url = 9;
    google.protobuf.Struct mcp_server_config = 10;
    map<string, string> auth_headers = 11;
    map<string, string> auth_env = 12;
    string connector_slug = 13;
}

message TaskOutputPort {
    string id = 1;
    string name = 2;
    string artifact_kind = 3;
    string description = 4;
}

message TaskInputPort {
    string id = 1;
    string name = 2;
    string artifact_kind = 3;
    bool required = 4;
    string description = 5;
}

message TaskArtifact {
    string port_id = 1;
    string artifact_kind = 2;
    string content = 3;
    string url = 4;
    string filename = 5;
    string mime_type = 6;
    int64 size = 7;
}

message PlaybookEdgeConfig {
    string source_id = 1;
    string target_id = 2;
    string source_output_port_id = 3;
    string target_input_port_id = 4;
}

message PlaybookNodeConfig {
    string id = 1;
    string title = 2;
    string description = 3;
    string assigned_agent_id = 4;
    int32 execution_order = 5;
    optional float x = 6;               // X position pour le layout visuel
    optional float y = 7;               // Y position pour le layout visuel
    bool interrupt_before = 8;
    bool interrupt_after = 9;
    bool allow_clarification = 10;
    string clarification_prompt = 11;
    int32 max_clarifications = 12;
    repeated string input_keys = 13;
    string output_key = 14;
    repeated TaskInputPort input_ports = 15;
    repeated TaskOutputPort output_ports = 16;
    string task_type = 17;
}

message ExistingPlaybook {
    repeated PlaybookNodeConfig nodes = 1;
    repeated PlaybookEdgeConfig edges = 2;
}

message GeneratePlaybookRequest {
    string query = 1;
    repeated Agent available_agents = 2;
    repeated WorkspaceContext workspace_context = 3;
    ExistingPlaybook existing_playbook = 4;   // Vide pour creation, rempli pour modification
    string model = 5;                         // Modele LLM (ex: "azure/gpt-4.1")
    map<string, string> prompt_overrides = 6;
    UserContext user_context = 7;
}

message GeneratePlaybookResponse {
    repeated PlaybookNodeConfig nodes = 1;
    repeated PlaybookEdgeConfig edges = 2;
    Usage usage = 3;
}

message ArtifactRef {
    string document_id = 1;
    string workspace_id = 2;
    string url = 3;
    string filename = 4;
    string mime_type = 5;
}

message PortPayload {
    string port_id = 1;
    string artifact_kind = 2;
    oneof body {
        string content = 3;
        ArtifactRef ref = 4;
        google.protobuf.Struct data = 5;
    }
    google.protobuf.Struct metadata = 6;
    string source_task_id = 7;
    string source_port_id = 8;
    google.protobuf.Timestamp produced_at = 9;
}

message PlaybookTaskResult {
    string task_id = 1;
    string status = 2;
    reserved 3;
    string error = 4;
    int64 duration_ms = 5;
    repeated Component components = 6;
    Usage usage = 7;
    repeated ToolTraceItem tool_trace = 8;
    SemanticMatch semantic_match = 9;
    repeated LLMPromptTraceItem llm_prompt_trace = 10;
    repeated TaskArtifact artifacts = 11;
    repeated PortPayload emitted_payloads = 20;
    repeated IteratorIterationResult iterator_iterations = 21;
}

message IteratorChildResult {
    string task_id = 1;
    string task_title = 2;
    string status = 3;
    string output = 4;
    string error = 5;
    repeated Component components = 6;
    repeated ToolTraceItem tool_trace = 7;
    repeated LLMPromptTraceItem llm_prompt_trace = 8;
    repeated TaskArtifact artifacts = 9;
    repeated PortPayload emitted_payloads = 10;
}

message IteratorIterationResult {
    int32 index = 1;
    string status = 2;
    string item_preview = 3;
    string output = 4;
    string error = 5;
    repeated IteratorChildResult child_results = 6;
    repeated TaskArtifact artifacts = 7;
}

message InterruptPayload {
    string type = 1;
    string task_id = 2;
    string task_title = 3;
    string message = 4;
    string thread_id = 5;
    string task_description = 6;
    string result = 7;
    string interrupt_id = 8;
    int32 round = 9;
    string conversation_json = 10;
    repeated string resumable_actions = 11;
}

// --- Request messages ---

message RunPlaybookWorkflowRequest {
    UserContext user_context = 1;
    string playbook_id = 2;
    string query = 4;
    repeated PlaybookTaskConfig tasks = 5;
    repeated Agent agents = 6;
    repeated PlaybookEdgeConfig edges = 7;
    repeated WorkspaceContext workspace_context = 8;
    string execution_mode = 9;
    repeated ValidatedTaskReplay validated_replays = 10;
    map<string, string> step_execution_modes = 11;
    map<string, string> prompt_overrides = 12;
    google.protobuf.Struct trigger_context = 13;
    string trigger_context_json = 14;
    string user_language = 15;
    bool deep_search = 16;
}

message ResumePlaybookWorkflowRequest {
    UserContext user_context = 1;
    string playbook_id = 2;
    string thread_id = 4;
    HumanResponse human_response = 5;
    string task_id = 6;
    string interrupt_id = 7;
    repeated PlaybookTaskConfig tasks = 8;
    repeated PlaybookEdgeConfig edges = 9;
}

message RunStepRequest {
    UserContext user_context = 1;
    string playbook_id = 2;
    PlaybookTaskConfig task = 4;
    Agent agent = 5;
    string context_from_dependencies = 6;
    repeated WorkspaceContext workspace_context = 7;
    string execution_mode = 8;
    ValidatedTaskReplay validated_replay = 9;
    repeated PlaybookEdgeConfig edges = 10;
    repeated PlaybookTaskResult upstream_results = 11;
    map<string, string> prompt_overrides = 12;
    google.protobuf.Struct trigger_context = 13;
    repeated PortPayload node_inputs = 14;
    repeated string declared_output_ports = 15;
    string user_language = 16;
}

message ResumeStepRequest {
    UserContext user_context = 1;
    string playbook_id = 2;
    string thread_id = 3;
    HumanResponse human_response = 4;
    string task_id = 5;
}

message StopPlaybookWorkflowRequest {
    UserContext user_context = 1;
    string thread_id = 2;
}

message StopPlaybookWorkflowResponse {
    bool success = 1;
    string message = 2;
}

// --- Human-in-the-loop messages ---

message HumanResponse {
    string action = 1;                 // "reply" | "approve" | "reject" | "skip"
    string message = 2;                // Free-form user reply for conversational HITL
    bool approved = 3;               // Legacy compatibility: whether the human approved or rejected
    string reason = 4;               // Legacy compatibility: reason for rejection
    string feedback = 5;             // Legacy compatibility: review/clarification feedback
}

// --- Response messages ---

message ToolTraceItem {
    int32 call_index = 1;
    string tool_name = 2;
    google.protobuf.Struct args = 3;
    string output_summary = 4;
}

message LLMPromptTraceItem {
    string stage = 1;
    string model = 2;
    string prompt = 3;
}

message ValidatedTaskReplay {
    string replay_id = 1;
    string task_id = 2;
    int32 validation_version = 3;
    string mode = 4;
    repeated ToolTraceItem tool_calls = 5;
    string reference_output = 6;
    bool preserve_output_format = 7;
    string output_format_guide = 8;
}

message SemanticMatch {
    int32 match_score = 1;
    int32 semantic_similarity_score = 2;
    int32 judge_score = 3;
    string reason = 4;
    repeated string missing_points = 5;
    repeated string changed_points = 6;
    string model = 7;
    bool judge_used = 8;
    int32 evidence_consistency_score = 9;
}

message EvaluateSemanticMatchRequest {
    UserContext user_context = 1;
    string baseline_output = 2;
    string current_output = 3;
    string task_title = 4;
    string task_description = 5;
    repeated string baseline_tool_summaries = 6;
    repeated string current_tool_summaries = 7;
}

message EvaluateSemanticMatchResponse {
    bool has_match = 1;
    SemanticMatch semantic_match = 2;
}

message TaskAdvisorToolTraceItem {
    int32 call_index = 1;
    string tool_name = 2;
    google.protobuf.Struct args = 3;
    string output_summary = 4;
}

message TaskAdvisorPromptTraceItem {
    string stage = 1;
    string model = 2;
    string prompt = 3;
}

message TaskAdvisorRequest {
    string execution_id = 1;
    string owner_id = 2;
    string playbook_id = 3;
    string task_id = 4;
    string task_title = 5;
    string task_description = 6;
    string expected_result = 7;
    string output_format_guide = 8;
    string baseline_output = 9;
    string task_output = 10;
    string task_error = 11;
    string task_status = 12;
    repeated TaskAdvisorToolTraceItem tool_trace = 13;
    string artifacts_json = 14;
    google.protobuf.Struct task_metadata = 15;
    Usage usage = 16;
    repeated TaskAdvisorPromptTraceItem llm_prompt_trace = 17;
}

message TaskAdvisorResult {
    int32 accuracy_score = 1;
    int32 completeness_score = 2;
    int32 result_matching_score = 3;
    int32 overall_score = 4;
    double confidence = 5;
    int32 tool_usage_score = 6;
    string expected_result_source = 7;
    string expected_result_type = 8;
    bool expected_result_matched = 9;
    string expected_result_reason = 10;
    repeated string missing_facts = 11;
    repeated string incoherences = 12;
    repeated string unsupported_claims = 13;
    repeated string handoff_risks = 14;
    repeated string rewrite_hints = 15;
    repeated string tool_selection_issues = 16;
    repeated string missing_tool_calls = 17;
    repeated string redundant_tool_calls = 18;
    repeated string tool_output_use_issues = 19;
    repeated string tool_sequencing_issues = 20;
    repeated string tool_usage_strengths = 21;
    string tool_usage_recommendation = 22;
    string safe_auto_fix_type = 23;
    string recommendation = 24;
    string reason = 25;
    string model = 26;
    int32 relevance_score = 27;
    int32 specificity_score = 28;
    int32 format_compliance_score = 29;
    int32 evidence_grounding_score = 30;
    int32 handoff_readiness_score = 31;
    int32 hitl_appropriateness_score = 32;
    int32 determinism_score = 33;
    int32 step_optimization_priority = 34;
    int32 playbook_optimization_priority = 35;
    string risk_severity = 36;
    int32 blocking_issue_count = 37;
    string downstream_impact_level = 38;
    string recommended_action = 39;
    int32 cost_efficiency_score = 40;
    int32 cost_optimization_priority = 41;
    int32 estimated_token_reduction_pct = 42;   // -1 means unknown.
    int32 estimated_latency_reduction_pct = 43; // -1 means unknown.
    repeated string cost_optimization_hints = 44;
    repeated string script_replacement_hints = 45;
    repeated string llm_still_required_reasons = 46;
}

enum NodeAdvisorSuggestionType {
    NODE_ADVISOR_SUGGESTION_TYPE_UNSPECIFIED = 0;
    NODE_ADVISOR_SUGGESTION_TYPE_TASK_TITLE = 1;
    NODE_ADVISOR_SUGGESTION_TYPE_TASK_DESCRIPTION = 2;
    NODE_ADVISOR_SUGGESTION_TYPE_AGENT_SELECTION = 3;
    NODE_ADVISOR_SUGGESTION_TYPE_DATASOURCE_CONNECTION = 4;
    NODE_ADVISOR_SUGGESTION_TYPE_INPUT_CONTRACT = 5;
    NODE_ADVISOR_SUGGESTION_TYPE_OUTPUT_CONTRACT = 6;
    NODE_ADVISOR_SUGGESTION_TYPE_GENERAL = 7;
}

message NodeAdvisorPortSuggestion {
    string id = 1;
    string name = 2;
    string artifact_kind = 3;
    string description = 4;
}

message NodeAdvisorDatasourceSuggestion {
    string source_task_id = 1;
    string source_output_port_id = 2;
    string target_input_port_id = 3;
    string datasource_type = 4;
    string datasource_id = 5;
    string datasource_name = 6;
    string rationale = 7;
}

message NodeAdvisorPatch {
    string task_title = 1;
    string task_description = 2;
    string assigned_agent_id = 3;
    repeated NodeAdvisorPortSuggestion input_ports = 4;
    repeated NodeAdvisorPortSuggestion output_ports = 5;
    repeated NodeAdvisorDatasourceSuggestion datasource_suggestions = 6;
}

message NodeAdvisorSuggestion {
    string id = 1;
    NodeAdvisorSuggestionType type = 2;
    string title = 3;
    string summary = 4;
    string rationale = 5;
    double confidence = 6;
    NodeAdvisorPatch patch = 7;
    repeated string warnings = 8;
}

message AdvisePlaybookNodeRequest {
    string playbook_id = 1;
    string task_id = 2;
    string playbook_name = 3;
    PlaybookTaskConfig target_task = 4;
    repeated PlaybookTaskConfig tasks = 5;
    repeated PlaybookEdgeConfig edges = 6;
    repeated string suggestion_types = 7;
    string user_intent = 8;
    bool include_graph_context = 9;
}

message AdvisePlaybookNodeResponse {
    string playbook_id = 1;
    string task_id = 2;
    repeated NodeAdvisorSuggestion suggestions = 3;
}
