syntax = "proto3";

import "chatbot.proto";

// Agent Orchestrator — production multi-agent planning/execution service.
//
// CQRS by design:
//   * COMMANDS (this gRPC surface): CreateSession / RunTask / StopSession — write side.
//   * READS: the live plan, per-step status and messages are projected into
//     Postgres and synced to the client via ElectricSQL. Nothing is streamed
//     back over gRPC. `GetSession` returns a one-shot snapshot for initial load.
//
// A single RunTask drives the whole hierarchy server-side:
//   planner (LLM) -> orchestrator (deterministic wave scheduler) ->
//   executor sub-agents run in PARALLEL when independent, SEQUENTIAL when a
//   step depends on another (see Step.depends_on). Blocking (ask-the-user or a
//   long-running MCP task) suspends the session; the user resumes with another
//   RunTask on the same session_id.
package yellowstorm.orchestrator.v1;

service CompanionAi {
  // Create an empty session for a user. Returns its id.
  rpc CreateSession (CreateSessionRequest) returns (CreateSessionResponse);

  // Submit a message (new turn OR a reply that resumes a blocked plan).
  // Runs in the background and acks immediately; progress is read via Electric.
  rpc RunTask (RunRequest) returns (RunResponse);

  // One-shot snapshot (title, status, current plan) for initial load / catch-up.
  // Steady-state progress comes from Electric, not this call.
  rpc GetSession (GetSessionRequest) returns (GetSessionResponse);

  // Cancel a running/blocked session (terminal — cannot be continued).
  rpc StopSession (StopSessionRequest) returns (StopSessionResponse);

  // Pause a running session: cancel the in-flight turn and keep the plan so it
  // can be continued later. Continue by sending RunTask on the same session_id
  // (worky re-drives the remaining steps). Unlike Stop, this is not terminal.
  rpc PauseSession (PauseSessionRequest) returns (PauseSessionResponse);

  // Hand an email reply to the step waiting for it. The routing token travelled
  // in the outbound mail and came back on the reply; only worky can turn it into
  // a session/step/interrupt, so the caller passes the token and worky resolves
  // and resumes internally — it does NOT reimplement continuation, it delegates
  // to the same resume the RunTask path uses.
  //
  // Claim-once: a token resolves for exactly one delivery. A duplicate (Graph
  // retries anything it thinks failed) returns delivered=false rather than
  // resuming the step a second time. Acks immediately like RunTask, so the
  // caller's webhook can answer Graph inside its timeout.
  rpc DeliverMailReply (DeliverMailReplyRequest) returns (DeliverMailReplyResponse);

  // The Teams chats worky is waiting on a reply in. Teams carries no routing
  // token and worky cannot subscribe to a chat it does not know, so the backend
  // polls: it asks which chats are open, reads each for a human reply, and hands
  // any back via DeliverMailReply(chat_id=...). A claimed wait drops off the
  // list, which is what stops the poll.
  rpc ListOpenChatWaits (ListOpenChatWaitsRequest) returns (ListOpenChatWaitsResponse);
}

// ===================== Commands =====================

message CreateSessionRequest  { string user_id = 1; }
message CreateSessionResponse { string session_id = 1; }

message RunRequest {
  string user_id    = 1;
  string session_id = 2;
  string message    = 3;
  repeated Skill skills = 5;
  repeated ConnectorBinding connectors = 6;
  repeated chatbot.Agent agents = 11;
  // Who the turn is for. user_id is an opaque id; these let the planner and
  // executor know the requester by name, so they address them directly and
  // never email or delegate a task back to the person who asked for it.
  string user_name  = 12;
  string user_email = 13;
  string user_role  = 14;
}

message RunResponse {
  string session_id = 1;
  bool   accepted   = 2;
  // Id of this turn (for tracing / correlating with server logs).
  string run_id     = 3;
}

message GetSessionRequest  { string user_id = 1; string session_id = 2; }
message GetSessionResponse {
  string session_id = 1;
  string title      = 2;
  // Session status: "pending" | "running" | "waiting" | "completed" | "failed"
  // | "canceled" (terminated by a user StopSession).
  string status     = 3;
  Plan   plan       = 4;  // current plan snapshot (may be empty before planning)
}

message StopSessionRequest  { string user_id = 1; string session_id = 2; }
message StopSessionResponse { bool stopped = 1; }

message PauseSessionRequest  { string user_id = 1; string session_id = 2; }
message PauseSessionResponse { bool paused = 1; }

message DeliverMailReplyRequest {
  // The routing token extracted from the reply's subject or quoted body.
  string token      = 1;
  // The reply body — becomes the parked step's answer, exactly as if the owner
  // had typed it in the chat.
  string reply_body = 2;
  // Who replied. The token routes to the wait, but the sender is verified
  // against the awaited mail's recipients: a reply only resolves the wait if it
  // came from one of them, so a stranger's mail — or worky's own outgoing copy
  // carrying the token — cannot answer a question meant for someone else.
  string reply_from = 3;
  repeated ConnectorBinding connectors = 5;
  repeated chatbot.Agent agents = 7;
  // Set INSTEAD of `token` when the reply came over Teams: Teams messages carry
  // no routing token (Graph correlates by chat identity), so the caller passes
  // the 1:1 chat id and worky resolves it to the parked step. Exactly one of
  // `token` / `chat_id` is set.
  string chat_id = 8;
}

message DeliverMailReplyResponse {
  // false when the token is unknown, already delivered, expired or cancelled.
  // Not an error: a duplicate notification is routine, and the caller should ack
  // it rather than have Graph retry.
  bool   delivered  = 1;
  string session_id = 2;
  string step_id    = 3;
}

message ListOpenChatWaitsRequest {}

message ListOpenChatWaitsResponse {
  repeated ChatWait waits = 1;
}

message ChatWait {
  string chat_id    = 1;   // the 1:1 chat to read for a reply
  string user_id    = 2;   // whose M365 token can read that chat
  string session_id = 3;
}

// ===================== Plan (the core UX object) =====================

message Plan {
  string id     = 1;
  string title  = 2;
  string goal   = 3;
  // "pending" | "running" | "blocked" | "completed" | "failed".
  string status = 4;
  repeated Step steps = 5;
}

message Step {
  string id          = 1;
  string description = 2;
  // "pending" | "running" | "blocked" | "completed" | "failed".
  string status      = 3;
  // Ids of steps that must complete before this one can start. Empty = ready.
  // Independent steps (disjoint dependency sets) run in parallel.
  repeated string depends_on = 4;
  // Parallel wave index assigned by the orchestrator (0-based). Steps sharing a
  // wave run concurrently; the client can group by this.
  int32  wave           = 5;
  // Which executor sub-agent is handling this step (for display/tracing).
  string agent          = 6;
  // Short result/summary when completed.
  string result         = 7;
  string error          = 8;
  // Why the step is blocked (e.g. "awaiting user input", "long-running task").
  string blocked_reason = 9;
}

// ===================== Skills (progressive-disclosure prompt injection) =====================
// Field shape mirrors chatbot.proto so the existing client mapping is reused.

message Skill {
  string id            = 1;
  string name          = 2;
  string description   = 3;
  string instructions  = 4;
  string license       = 5;
  string compatibility = 6;
  map<string, string> metadata = 7;
  repeated string allowed_tools = 8;
  repeated SkillFile files = 9;
}

message SkillFile {
  string path      = 1;
  string kind      = 2;
  string mime_type = 3;
  string content   = 4;
}

// ===================== Connectors (per-user MCP servers as tools) =====================

message ConnectorBinding {
  string connector_id      = 1;
  string connector_name    = 2;
  string mcp_transport_type = 3;           // e.g. "streamable_http"
  string mcp_server_url    = 4;
  map<string, string> auth_headers = 5;    // ready-to-use HTTP headers
  map<string, string> auth_env     = 6;    // env vars for stdio transports
  repeated ConnectorAction actions = 7;    // enabled actions of this connector
  string mcp_server_config_json = 8;
}

message ConnectorAction {
  string action_key            = 1;
  string label                 = 2;
  string description           = 3;
  string parameter_schema_json = 4;        // JSON Schema of the action params
}
