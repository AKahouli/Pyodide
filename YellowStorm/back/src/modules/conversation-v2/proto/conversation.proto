syntax = "proto3";

package yellostorm.manus.v1;

service ConversationV2 {
  rpc CreateSession   (CreateSessionRequest)   returns (CreateSessionResponse);
  rpc GetSession      (GetSessionRequest)      returns (GetSessionResponse);
  rpc StopSession     (StopSessionRequest)     returns (StopSessionResponse);
  rpc Chat            (ChatRequest)            returns (stream Event);
  rpc GetVncSignedUrl (GetVncSignedUrlRequest) returns (GetVncSignedUrlResponse);
  rpc PauseSession    (PauseSessionRequest)    returns (PauseSessionResponse);
  rpc ResumeSession   (ResumeSessionRequest)   returns (ResumeSessionResponse);
  rpc Deploy          (DeployRequest)          returns (DeployResponse);
}

message GetVncSignedUrlRequest  { string user_id = 1; string session_id = 2; }
message GetVncSignedUrlResponse { string url = 1; int64 expires_at = 2; }

message PauseSessionRequest   { string user_id = 1; string session_id = 2; }
message PauseSessionResponse  {}
message ResumeSessionRequest  { string user_id = 1; string session_id = 2; }
message ResumeSessionResponse {}

// Deploy/publish the app built in this session to a public URL. Synchronous:
// Manus performs the deployment and returns the live URL. `deployed_at` is
// epoch seconds. Re-invoking redeploys (update).
message DeployRequest  { string user_id = 1; string session_id = 2; }
message DeployResponse { string url = 1; int64 deployed_at = 2; }

// workspace_paths: optional list of Ceph object-key prefixes in the form
// "{workspaceOwnerUserId}/{workspaceStoragePrefix}" — one entry per workspace
// the user attached via the frontend selector. The backend validates ownership
// / share access on the workspaceId portion, looks up the workspace owner
// and immutable storage prefix, then builds the path before forwarding. The
// AI service uses these as List-prefix bases when scanning the workspace's
// documents. Note: path roots under the workspace OWNER, not the current
// user — collaborator uploads share the same prefix as the owner's files.
message CreateSessionRequest  { string user_id = 1; repeated string workspace_paths = 2; }
message CreateSessionResponse { string session_id = 1; }

message GetSessionRequest  { string user_id = 1; string session_id = 2; }
message GetSessionResponse {
  string session_id = 1;
  string title = 2;
  string status = 3;
  bool   is_shared = 4;
  repeated Event events = 5;
}

message StopSessionRequest  { string user_id = 1; string session_id = 2; }
message StopSessionResponse {}

message WorkyResponse { string session_id = 1; bool accepted = 2; }

message ChatRequest {
  string user_id    = 1;
  string session_id = 2;
  string message    = 3;
  optional string event_id = 4;
  optional int64  timestamp = 5;
  string model = 6;  // Required: full LiteLLM model identifier e.g. "azure/gpt-4.1", "anthropic/claude-sonnet-4-5"
  repeated Skill  skills    = 8;   // skills selected by the user, injected into the agent prompt
  repeated ConnectorBinding connectors = 9;   // selected connectors (MCP servers); auth already resolved by YellowMind
}

// --- Skills (Agent Skills pattern / progressive disclosure) ---
// Same shape as v1 (chatbot.proto) so YellowMind can reuse findByIdsForGrpc().
message Skill {
  string id = 1;
  string name = 2;
  string description = 3;
  string instructions = 4;
  string license = 5;
  string compatibility = 6;
  map<string, string> metadata = 7;
  repeated string allowed_tools = 8;
  repeated SkillFile files = 9;
}

message SkillFile {
  string path = 1;
  string kind = 2;
  string mime_type = 3;
  string content = 4;
}

// --- Connectors (remote MCP servers exposed as agent tools) ---
// One binding per selected connector. Auth is already resolved per-user by
// YellowMind (token + identity headers), so the engine only has to connect.
message ConnectorBinding {
  string connector_id = 1;
  string connector_name = 2;
  string mcp_transport_type = 3;            // e.g. "streamable_http"
  string mcp_server_url = 4;
  map<string, string> auth_headers = 5;     // ready-to-use HTTP headers (Bearer token, X-User-*, ...)
  map<string, string> auth_env = 6;         // env vars for stdio transports
  repeated ConnectorAction actions = 7;     // enabled actions, defined at connector creation time
}

// A single callable action of a connector (one MCP tool).
message ConnectorAction {
  string action_key = 1;
  string label = 2;
  string description = 3;
  string parameter_schema_json = 4;         // JSON Schema of the action params, serialized as a string
}

message Event {
  string event_id  = 1;
  int64  timestamp = 2;
  oneof payload {
    MessageEvent message = 10;
    ToolEvent    tool    = 11;
    StepEvent    step    = 12;
    PlanEvent    plan    = 13;
    TitleEvent   title   = 14;
    DoneEvent    done    = 15;
    WaitEvent    wait    = 16;
    ErrorEvent   error   = 17;
    ApplicationComponentEvent application_component = 18;
  }
}

message MessageEvent {
  string role = 1;          // "user" | "assistant"
  string content = 2;
  repeated FileInfo attachments = 3;
}

message ToolEvent {
  string tool_call_id = 1;
  string name = 2;
  string status = 3;        // matches Manus ToolStatus
  string function = 4;
  string args_json = 5;     // JSON-encoded Dict[str, Any]
  ToolContent content = 6;
}

message StepEvent {
  string id = 1;
  string status = 2;
  string description = 3;
}

message PlanEvent {
  repeated StepEvent steps = 1;
}

message TitleEvent { string title = 1; }
message DoneEvent  {}
message WaitEvent  {}
message ErrorEvent { string error = 1; }

// Pushes a UI "application component" (an embeddable web app / preview) for the
// frontend to render in the conversation's side panel. Unlike a tool result,
// this is not tied to a tool_call — the agent asks the app to display `url`
// (shown in an <iframe>) directly. `title` labels the panel.
message ApplicationComponentEvent {
  string url = 1;
  string title = 2;
}

message ToolContent {
  oneof variant {
    BrowserToolContent browser = 1;
    ShellToolContent   shell   = 2;
    FileToolContent    file    = 3;
    SearchToolContent  search  = 4;
    McpToolContent     mcp     = 5;
    WebPageToolContent webpage = 6;
    GenericToolContent generic = 99;
  }
}

message BrowserToolContent {
  string screenshot_url = 1;
  string url            = 2;
  string title          = 3;
}
message ShellToolContent {
  string command        = 1;
  string output         = 2;
  int32  exit_code      = 3;
  string session_handle = 4;
}
message FileToolContent {
  string path      = 1;
  string content   = 2;
  string language  = 3;
  string operation = 4;
}
message SearchToolContent {
  string query              = 1;
  repeated SearchResult results = 2;
}
message SearchResult {
  string title   = 1;
  string url     = 2;
  string snippet = 3;
}
message McpToolContent {
  string server      = 1;
  string tool        = 2;
  string result_json = 3;
}
message WebPageToolContent {
  string url   = 1;
  string title = 2;
}
message GenericToolContent { string json = 1; }

message FileInfo {
  string id = 1;
  string name = 2;
  string content_type = 3;
  string path = 4;
}
