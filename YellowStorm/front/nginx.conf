server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Nodepod SharedArrayBuffer (COOP + COEP). credentialless keeps
  # cross-origin S3/API fetches working without CORP on every CDN.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # Nodepod service worker + process worker must be JS, never SPA HTML fallback.
  location = /__sw__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__sw__.js =404;
  }

  location = /__worker__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__worker__.js =404;
  }

  # The built app requests <this-origin>/MY_APP_VITE_API_URL/... when the container has no
  # backend URL injected. Without this block `location /` answers with the SPA HTML and a 200,
  # so the app sees HTML instead of JSON and reports "no authentication methods available".
  # Fail loudly with a 503 and an explicit message instead.
  location /MY_APP_ {
    default_type application/json;
    return 503 '{"error":{"code":"ERR_FRONT_CONFIG","message":"No backend URL configured: MY_APP_VITE_API_URL was not injected at container start. Set it on the front container and restart."}}';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
