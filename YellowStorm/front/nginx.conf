server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # NOTE: nginx add_header inheritance is all-or-nothing per location — any
  # location block that declares its own add_header silently drops every
  # server-level header below (CSP, COOP, COEP). The SPA document is served
  # via `location /` and inherits them; repeat them if a new location block
  # ever needs its own add_header.

  # Nodepod SharedArrayBuffer (COOP + COEP). credentialless keeps
  # cross-origin S3/API fetches working without CORP on every CDN.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # CSP: no inline scripts (the injection vector that could steal the
  # in-memory access token), no plugins, no framing. connect-src and the
  # media/frame sources stay broad on purpose: API/socket origins are runtime
  # configuration (env.sh -> /config.js), not build-time constants, and
  # plain-HTTP API deployments are supported. 'unsafe-eval' is required by the
  # Nodepod in-browser app runtime (it compiles preview code with new
  # Function); tightening means moving that compilation into a worker with
  # its own policy. 'wasm-unsafe-eval' covers the same toolchain's WASM.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: wss:; media-src 'self' blob: data: https:; frame-src 'self' blob: data: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # Nodepod service worker + process worker must be JS, never SPA HTML fallback.
  location = /__sw__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__sw__.js =404;
  }

  location = /__worker__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__worker__.js =404;
  }

  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /config.js =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
