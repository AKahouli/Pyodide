server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Nodepod SharedArrayBuffer (COOP + COEP). credentialless keeps
  # cross-origin S3/API fetches working without CORP on every CDN.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # Nodepod service worker + process worker must be JS, never SPA HTML fallback.
  location = /__sw__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__sw__.js =404;
  }

  location = /__worker__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__worker__.js =404;
  }

  # Socket.IO → YellowStorm back (/app-runtime, /browser-session, /whatsapp).
  # Browser connects to this front origin (getSocketBaseUrl → window.location.origin
  # when API is same-host). Without this block, /socket.io/ falls through to the SPA
  # and tool-invoke never finds a registered runtime.
  #
  # Placeholders replaced at container start by env.sh:
  #   MY_APP_BACKEND_UPSTREAM  e.g. https://poc.back.yellowmind.ai
  #   MY_APP_BACKEND_HOST      e.g. poc.back.yellowmind.ai
  location /socket.io/ {
    proxy_pass MY_APP_BACKEND_UPSTREAM;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host MY_APP_BACKEND_HOST;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_server_name on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
