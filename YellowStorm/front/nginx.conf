server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Nodepod SharedArrayBuffer (COOP + COEP). credentialless keeps
  # cross-origin S3/API fetches working without CORP on every CDN.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;

  # Nodepod service worker + process worker must be JS, never SPA HTML fallback.
  location = /__sw__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__sw__.js =404;
  }

  location = /__worker__.js {
    default_type application/javascript;
    add_header Cache-Control "no-cache" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    try_files /__worker__.js =404;
  }

  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    try_files /config.js =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
