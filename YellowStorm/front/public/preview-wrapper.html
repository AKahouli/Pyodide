<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe
    id="pv"
    sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
  ></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var src = params.get('src');
      if (!src) return;
      try {
        var parsed = new URL(src, window.location.href);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return;
      } catch (e) {
        return;
      }
      document.getElementById('pv').src = src;

      // When the YellowStorm tab is open, relay App Data requests through
      // BroadcastChannel so BrowserRuntimeHost injects the owner ticket.
      var proxyChannel = null;
      try { proxyChannel = new BroadcastChannel('ym-app-data-proxy'); } catch (e) {}

      var pending = {};
      var pxId = 0;

      function isAppDataUrl(url) {
        try {
          var p = new URL(url, window.location.href);
          return p.pathname.indexOf('/app-data/public/') !== -1 || p.pathname.indexOf('/v1/apps/') === 0;
        } catch (e) { return false; }
      }

      // Receive responses from BroadcastChannel and forward to the iframe.
      if (proxyChannel) {
        proxyChannel.onmessage = function (e) {
          if (!e.data || e.data.type !== 'ym-app-data-response') return;
          var rec = pending[e.data.id];
          if (!rec) return;
          delete pending[e.data.id];
          clearTimeout(rec.tm);
          rec.resolve(e.data);
        };
      }

      window.addEventListener('message', function (e) {
        if (!e.data || e.data.type !== 'ym-app-data-fetch') return;
        var d = e.data;
        var s = e.source;
        if (!s) return;
        var url = typeof d.url === 'string' ? d.url : '';
        if (!isAppDataUrl(url)) return;

        // Try BroadcastChannel relay (owner ticket injected by YellowStorm tab).
        if (proxyChannel) {
          var id = 'pxy-' + (++pxId) + '-' + Date.now();
          var tm = setTimeout(function () {
            delete pending[id];
            // Fallback: direct fetch without auth.
            directFetch(d, s, e.origin);
          }, 8000);
          pending[id] = { resolve: function (msg) { s.postMessage(msg, e.origin && e.origin !== 'null' ? e.origin : '*'); }, tm: tm };
          proxyChannel.postMessage({
            type: 'ym-app-data-fetch',
            id: id,
            url: url,
            method: d.method || 'GET',
            headers: d.headers || undefined,
            body: d.body || undefined,
          });
          return;
        }

        // Fallback: direct fetch (no auth — preview without YellowStorm tab).
        directFetch(d, s, e.origin);
      });

      function directFetch(d, s, origin) {
        var url = typeof d.url === 'string' ? d.url : '';
        fetch(url, {
          method: d.method || 'GET',
          headers: d.headers || undefined,
          body: d.body || undefined,
        })
          .then(function (r) {
            return r.text().then(function (b) {
              var h = {};
              r.headers.forEach(function (v, k) { h[k] = v; });
              s.postMessage(
                { type: 'ym-app-data-response', id: d.id, status: r.status, headers: h, body: b },
                origin && origin !== 'null' ? origin : '*',
              );
            });
          })
          .catch(function (err) {
            s.postMessage(
              { type: 'ym-app-data-response', id: d.id, error: err.message },
              origin && origin !== 'null' ? origin : '*',
            );
          });
      }

      document.getElementById('pv').addEventListener('load', function () {
        try {
          var iw = this.contentWindow;
          if (!iw) return;
          var origFetch = iw.fetch.bind(iw);
          iw.fetch = function (input, init) {
          var url = typeof input === 'string' ? input : (input && input.url) || '';
          var isAppDataUrl =
            url.indexOf('/app-data/public/') !== -1 || url.indexOf('/v1/apps/') === 0;
          if (isAppDataUrl && init && init.body) {
              return new Promise(function (resolve, reject) {
                var id = 'pxy-' + (++window._ymPxyId) + '-' + Date.now();
                var tm = setTimeout(function () {
                  iw.removeEventListener('message', h);
                  reject(new Error('proxy timeout'));
                }, 30000);
                function h(ev) {
                  if (!ev.data || ev.data.type !== 'ym-app-data-response' || ev.data.id !== id) return;
                  iw.removeEventListener('message', h);
                  clearTimeout(tm);
                  if (ev.data.error) {
                    reject(new Error(ev.data.error));
                    return;
                  }
                  resolve(
                    new iw.Response(ev.data.body || '', {
                      status: ev.data.status || 200,
                      headers: new iw.Headers(ev.data.headers || {}),
                    }),
                  );
                }
                iw.addEventListener('message', h);
                window.postMessage(
                  {
                    type: 'ym-app-data-fetch',
                    id: id,
                    url: url,
                    method: init.method || 'GET',
                    headers: init.headers || undefined,
                    body: init.body || undefined,
                  },
                  window.location.origin,
                );
              });
            }
            return origFetch(input, init);
          };
        } catch (e) {}
      });
      window._ymPxyId = 0;
    })();
  </script>
</body>
</html>
