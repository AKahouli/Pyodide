<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Preview</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { height: 100%; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe
    id="pv"
    sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-same-origin allow-scripts"
  ></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var src = params.get('src');
      if (!src) return;
      var previewOrigin = null;
      try {
        var parsed = new URL(src, window.location.href);
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return;
        previewOrigin = parsed.origin;
      } catch (e) {
        return;
      }
      document.getElementById('pv').src = src;

      // App Data relay is one hop up: preview iframe -> this wrapper -> the
      // opening YellowStorm tab (window.opener). The host serves a request only
      // when event.source is the registered popup WindowProxy AND event.origin
      // is the exact host origin, and replies with that exact origin — so no
      // '*' is ever used here and the owner ticket never leaves the host tab.
      var appOrigin = window.location.origin;
      var appOpener = window.opener;

      window._ymPxyId = 0;

      function isAppDataUrl(url) {
        try {
          var p = new URL(url, window.location.href);
          return p.pathname.indexOf('/app-data/public/') !== -1 || p.pathname.indexOf('/v1/apps/') === 0;
        } catch (e) { return false; }
      }

      function isAiProxyUrl(url) {
        try {
          // Prefer API-shaped paths; accept root-relative /api/v1/... from the OpenAI SDK.
          var path = String(url || '');
          try {
            path = new URL(url, window.location.href).pathname;
          } catch (e) { /* keep string */ }
          path = path.replace(/\/$/, '');
          return path.indexOf('/chat/completions') !== -1 || /\/models(\/|$)/.test(path);
        } catch (e) { return false; }
      }

      window.addEventListener('message', function (e) {
        if (!e.data || typeof e.data !== 'object') return;
        var type = e.data.type;
        if (type === 'ym-app-data-fetch' || type === 'ym-ai-fetch') {
          // Accept only the preview iframe, or this wrapper's own fetch hook.
          var fromIframe =
            e.source === document.getElementById('pv').contentWindow && e.origin === previewOrigin;
          var fromSelf = e.source === window && e.origin === appOrigin;
          if (!fromIframe && !fromSelf) return;
          var url = typeof e.data.url === 'string' ? e.data.url : '';
          if (type === 'ym-app-data-fetch' && (!isAppDataUrl(url) || !appOpener)) return;
          if (type === 'ym-ai-fetch' && (!isAiProxyUrl(url) || !appOpener)) return;
          appOpener.postMessage(
            {
              type: type,
              id: e.data.id,
              url: url,
              method: e.data.method,
              headers: e.data.headers,
              body: e.data.body,
            },
            appOrigin,
          );
          return;
        }
        if (type === 'ym-app-data-response' || type === 'ym-ai-response') {
          // Only the opening YellowStorm tab replies; route to the preview
          // iframe using its own exact origin.
          if (e.origin !== appOrigin) return;
          var fromOpener = !appOpener || e.source === appOpener;
          if (!fromOpener) return;
          var iw = document.getElementById('pv').contentWindow;
          if (!iw) return;
          iw.postMessage(e.data, previewOrigin);
        }
      });

      // Capture direct fetch() calls inside the preview app and route them
      // through the same tunnel (the generated SDK posts ym-app-data-fetch).
      document.getElementById('pv').addEventListener('load', function () {
        try {
          var iw = this.contentWindow;
          if (!iw) return;
          var origFetch = iw.fetch.bind(iw);
          iw.fetch = function (input, init) {
            var url = typeof input === 'string' ? input : (input && input.url) || '';
            if (!isAppDataUrl(url)) return origFetch(input, init);
            return new Promise(function (resolve, reject) {
              var id = 'pxy-' + (++window._ymPxyId) + '-' + Date.now();
              var tm = setTimeout(function () {
                iw.removeEventListener('message', h);
                reject(new Error('App Data proxy timeout (30 s). Keep the YellowStorm tab open.'));
              }, 30000);
              function h(ev) {
                if (!ev.data || ev.data.type !== 'ym-app-data-response' || ev.data.id !== id) return;
                iw.removeEventListener('message', h);
                clearTimeout(tm);
                if (ev.data.error) { reject(new Error(ev.data.error)); return; }
                resolve(
                  new iw.Response(ev.data.body || '', {
                    status: ev.data.status || 200,
                    headers: new iw.Headers(ev.data.headers || {}),
                  }),
                );
              }
              iw.addEventListener('message', h);
              window.postMessage(
                {
                  type: 'ym-app-data-fetch',
                  id: id,
                  url: url,
                  method: (init && init.method) || 'GET',
                  headers: (init && init.headers) || undefined,
                  body: (init && init.body) || undefined,
                },
                window.location.origin,
              );
            });
          };
        } catch (e) {}
      });
    })();
  </script>
</body>
</html>
