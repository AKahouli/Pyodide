version: '3.8'

services:
  teams-mcp:
    build: .
    container_name: teams-mcp
    ports:
      - "8003:8003"
    environment:
      - TEAMS_MCP_TRANSPORT=sse
      - TEAMS_MCP_PORT=8003
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge