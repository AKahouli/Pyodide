[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "manus-mcp"
version = "0.1.0"
description = "MCP server exposing Firecracker microVM sandboxes as tools"
requires-python = ">=3.11"
dependencies = [
    # <2: mcp 2.0.0 removed `mcp.server.fastmcp` (FastMCP), which this server imports.
    "mcp[cli]>=1.2,<2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
manus-mcp = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox_mcp*"]
