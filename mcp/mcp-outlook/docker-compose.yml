version: '3.8'

services:
  outlook-mcp:
    build: .
    container_name: outlook-mcp
    ports:
      - "8005:8005"
    environment:
      - OUTLOOK_MCP_TRANSPORT=streamable-http
      - OUTLOOK_MCP_PORT=8005
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8005/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
