version: '3.8'

services:
  sharepoint-mcp:
    build: .
    container_name: sharepoint-mcp
    ports:
      - "8004:8004"
    environment:
      - SHAREPOINT_MCP_TRANSPORT=sse
      - SHAREPOINT_MCP_PORT=8004
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8004/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge