name: yellowmind-observability

# Isolated integration stack (plan §7.1). NOT high availability; filesystem storage.
# Publishes only Grafana (3300) and the authenticated Loki gateway (3100, localhost).

services:
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    # Local integration profile: the named volume is root-owned; production must chown the
    # volume to the image user (10001) instead of running as root.
    user: root
    volumes:
      - loki-data:/data
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "20m", max-file: "5" }

  gateway:
    image: nginx:1.27.3-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/htpasswd:/etc/nginx/htpasswd:ro
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "20m", max-file: "5" }

  alloy:
    image: grafana/alloy:v1.5.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-state:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-local}
      OBS_LOKI_URL: http://gateway:3100
      OBS_LOKI_USER: ${OBS_LOKI_USER:?set in .env}
      OBS_LOKI_PASSWORD: ${OBS_LOKI_PASSWORD:?set in .env}
    user: "0" # docker.sock access; socket is read-only and discovery is label-restricted
    depends_on:
      - gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "20m", max-file: "5" }

  prometheus:
    image: prom/prometheus:v3.2.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "20m", max-file: "5" }

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_TIMEZONE: Europe/Paris
      GRAFANA_LOKI_USER: ${OBS_LOKI_USER}
      GRAFANA_LOKI_PASSWORD: ${OBS_LOKI_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3300:3000"
    depends_on:
      - gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "20m", max-file: "5" }

  # Low-rate synthetic canary: proves the collection pipeline without touching business emitters.
  canary:
    image: nginx:1.27.3-alpine
    command: /bin/sh -c 'while true; do echo "{\"schema_version\":\"1.0\",\"timestamp\":\"$$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\",\"event_id\":\"canary-$$RANDOM\",\"event_name\":\"service.started\",\"message\":\"Service started\",\"severity_text\":\"INFO\",\"severity_number\":9,\"service_name\":\"observability-canary\",\"service_version\":\"1\",\"environment\":\"$${OBS_ENVIRONMENT:-local}\",\"event_origin\":\"infrastructure\",\"attributes\":{\"launcher\":\"canary\"}}"; sleep 30; done'
    environment:
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-local}
    labels:
      logging: "yellowmind"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { mode: non-blocking, max-buffer-size: "4m", max-size: "5m", max-file: "2" }

volumes:
  loki-data:
  alloy-state:
  prometheus-data:
  grafana-data:
