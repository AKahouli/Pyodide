apiVersion: 1
datasources:
  - name: Yellowmind Loki
    uid: yellowmind-loki
    type: loki
    access: proxy
    url: http://gateway:3100
    basicAuth: true
    basicAuthUser: ${GRAFANA_LOKI_USER}
    secureJsonData:
      basicAuthPassword: ${GRAFANA_LOKI_PASSWORD}
    isDefault: true
    jsonData:
      maxLines: 2000
      timeout: 60
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          urlDisplayLabel: "Find by trace_id"
          internalLink: true
          internalUid: yellowmind-incident-explorer
          datasourceUid: yellowmind-loki
        - name: request_id
          matcherRegex: '"request_id":"([^"]+)"'
          url: "$${__value.raw}"
          internalLink: true
          internalUid: yellowmind-incident-explorer
          datasourceUid: yellowmind-loki
        - name: run_id
          matcherRegex: '"run_id":"([^"]+)"'
          url: "$${__value.raw}"
          internalLink: true
          internalUid: yellowmind-incident-explorer
          datasourceUid: yellowmind-loki
