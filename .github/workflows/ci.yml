name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  proto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proto drift
        run: |
          if ! diff -q \
            YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
            yellowstorm-adk/grpc/proto/playbook-flow.proto
          then
            echo "::error::Proto drift detected! The backend and ADK proto copies differ."
            diff -u \
              YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
              yellowstorm-adk/grpc/proto/playbook-flow.proto
            exit 1
          fi
          echo "Proto files match"

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YellowStorm/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: YellowStorm/back/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci --forceExit --detectOpenHandles

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yellowstorm-adk
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Generate gRPC stubs
        run: python grpc/generate_proto.py
      - name: Run flow engine tests
        run: python -m pytest src/flow_engine/tests/ -v
