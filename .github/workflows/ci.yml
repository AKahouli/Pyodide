name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  proto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proto drift
        run: |
          if ! diff -q \
            YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
            yellowstorm-adk/grpc/proto/playbook-flow.proto
          then
            echo "::error::Proto drift detected! The backend and ADK proto copies differ."
            diff -u \
              YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
              yellowstorm-adk/grpc/proto/playbook-flow.proto
            exit 1
          fi
          echo "Proto files match"

          if ! diff -q \
            YellowStorm/back/src/modules/worky/proto/companion_ai.proto \
            yellowstorm-adk/grpc/proto/companion_ai/companion_ai.proto
          then
            echo "::error::Proto drift detected! The backend and ADK companion_ai proto copies differ."
            diff -u \
              YellowStorm/back/src/modules/worky/proto/companion_ai.proto \
              yellowstorm-adk/grpc/proto/companion_ai/companion_ai.proto
            exit 1
          fi
          echo "companion_ai proto files match"

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YellowStorm/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: YellowStorm/back/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run backend tests
        env:
          # ts-jest + v8 coverage over a large NestJS suite exceeds Node's
          # default ~2GB heap during the coverage merge; raise the ceiling.
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --ci --forceExit --detectOpenHandles --coverage --coverageProvider=v8
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: YellowStorm/back/coverage/lcov.info

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yellowstorm-adk
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manus
          POSTGRES_PASSWORD: manus
          POSTGRES_DB: manus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Generate gRPC stubs
        run: python grpc/generate_proto.py
      - name: Generate CompanionAi gRPC stubs
        run: python grpc/proto/companion_ai/generate.py
      - name: Run flow engine + orchestrator tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: manus
          PGPASSWORD: manus
          PGDATABASE: manus
        run: python -m pytest src/flow_engine/tests/ tests/orchestrator/ -v --cov=src/flow_engine --cov=grpc --cov=src/companion_ai --cov=src/grpc_server --cov-fail-under=0 --cov-report=xml:coverage.xml
      - name: Upload python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: yellowstorm-adk/coverage.xml

  sonarcloud:
    needs: [backend-tests, python-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: yellowstorm-adk/
        continue-on-error: true

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: YellowStorm/back/coverage/
        continue-on-error: true

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            ${{ github.event_name == 'pull_request' && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}', github.event.pull_request.number, github.head_ref, github.base_ref) || format('-Dsonar.branch.name={0}', github.ref_name) }}
