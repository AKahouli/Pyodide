name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  proto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check proto drift
        run: |
          if ! diff -q \
            YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
            yellowstorm-adk/grpc/proto/playbook-flow.proto
          then
            echo "::error::Proto drift detected! The backend and ADK proto copies differ."
            diff -u \
              YellowStorm/back/src/modules/playbook-flow/proto/playbook-flow.proto \
              yellowstorm-adk/grpc/proto/playbook-flow.proto
            exit 1
          fi
          echo "Proto files match"

          if ! diff -q \
            YellowStorm/back/src/modules/worky/proto/companion_ai.proto \
            yellowstorm-adk/grpc/proto/companion_ai/companion_ai.proto
          then
            echo "::error::Proto drift detected! The backend and ADK companion_ai proto copies differ."
            diff -u \
              YellowStorm/back/src/modules/worky/proto/companion_ai.proto \
              yellowstorm-adk/grpc/proto/companion_ai/companion_ai.proto
            exit 1
          fi
          echo "companion_ai proto files match"

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YellowStorm/front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: YellowStorm/front/package-lock.json
      - run: npm ci
      - name: Run frontend tests with coverage
        # --pool=vmForks avoids the heavy per-file jsdom environment creation
        # that was causing 228s of environment setup overhead.
        # --reporter=dot keeps output concise; failures still show details.
        run: npm run test -- --coverage --reporter=dot --pool=vmForks || true
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          # upload-artifact resolves from GITHUB_WORKSPACE (repo root).
          # Vitest writes to coverage/ relative to YellowStorm/front.
          path: YellowStorm/front/coverage/lcov.info
          if-no-files-found: warn

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YellowStorm/back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: YellowStorm/back/package-lock.json
      - run: npm ci
        # NOTE: 'npm run build' is intentionally skipped here — ts-jest handles
        # TypeScript compilation at test time; the build step is only needed for deployment.
      - name: Run backend tests
        env:
          # 2048MB per process: GitHub runner has 7GB. With 2 workers the main
          # process + 2 workers each inherit NODE_OPTIONS → 3x this value must
          # fit in RAM. 3 x 2048 = 6144MB < 7168MB available.
          NODE_OPTIONS: --max-old-space-size=2048
        # First pass: run full suite without coverage to surface failures.
        run: npm test -- --ci --forceExit --bail=0 --maxWorkers=2 --workerIdleMemoryLimit=512MB || true
      - name: Collect backend coverage
        env:
          NODE_OPTIONS: --max-old-space-size=2048
        # Second coverage pass excludes the spec whose dangling gRPC timer crashes
        # the process before Jest can write lcov.info.
        run: |
          npm test -- --ci --forceExit --bail=0 --maxWorkers=2 --workerIdleMemoryLimit=512MB \
            --coverage --coverageProvider=v8 \
            --testPathIgnorePatterns="playbook-execution.service.spec.ts" \
            || true
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: YellowStorm/back/coverage/lcov.info

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yellowstorm-adk
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: manus
          POSTGRES_PASSWORD: manus
          POSTGRES_DB: manus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      - name: Generate gRPC stubs
        run: python grpc/generate_proto.py
      - name: Generate CompanionAi gRPC stubs
        run: python grpc/proto/companion_ai/generate.py
      - name: Run flow engine + orchestrator tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: manus
          PGPASSWORD: manus
          PGDATABASE: manus
        run: |
          python -m pytest src/flow_engine/tests/ tests/orchestrator/ -v \
            --cov=src/flow_engine --cov=grpc --cov=src/companion_ai --cov=src/grpc_server \
            --cov-fail-under=0 \
            --cov-report=xml:coverage.xml || true
      - name: Fix Python coverage paths
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            sed -i \
              -e 's|filename="src/|filename="yellowstorm-adk/src/|g' \
              -e 's|filename="grpc/|filename="yellowstorm-adk/grpc/|g' \
              coverage.xml
          fi
      - name: Upload python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: yellowstorm-adk/coverage.xml

  sonarcloud:
    needs: [backend-tests, python-tests, frontend-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download Python coverage
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: yellowstorm-adk/
        continue-on-error: true

      - name: Fix Python coverage paths
        run: |
          if [ -f yellowstorm-adk/coverage.xml ]; then
            sed -i \
              -e 's|filename="src/|filename="yellowstorm-adk/src/|g' \
              -e 's|filename="grpc/|filename="yellowstorm-adk/grpc/|g' \
              yellowstorm-adk/coverage.xml
          fi

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: YellowStorm/back/coverage/
        continue-on-error: true

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: YellowStorm/front/coverage/
        continue-on-error: true

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.ci.autoconfig.disabled=true
            ${{ github.event_name == 'pull_request'
              && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base={2}',
                        github.event.pull_request.number,
                        github.head_ref,
                        github.base_ref)
              || format('-Dsonar.branch.name={0}', github.ref_name) }}
