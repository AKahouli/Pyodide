name: SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  sonarscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # --------------------------
      # SonarCloud scan (direct CLI — no PR auto-detection)
      # Note: tests skipped intentionally — re-enable once failing specs are fixed
      # --------------------------
      - name: Install sonar-scanner
        run: |
          curl -sSLo /tmp/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/sonar-scanner.zip -d /opt/
          echo "/opt/sonar-scanner-6.2.1.4610-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.branch.name=${{ inputs.branch }} \
            -Dsonar.scm.revision="${{ github.sha }}"
