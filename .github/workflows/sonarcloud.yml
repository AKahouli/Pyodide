name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # --------------------------
      # SonarQube scan (self-hosted — no LOC limit)
      # with PR analysis enabled via Community Branch Plugin
      # --------------------------
      - name: Install sonar-scanner
        run: |
          curl -sSLo /tmp/sonar-scanner.zip \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux-x64.zip
          unzip -q /tmp/sonar-scanner.zip -d /opt/
          echo "/opt/sonar-scanner-6.2.1.4610-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Running SonarQube scan for Pull Request #${{ github.event.pull_request.number }}"
            sonar-scanner \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.scm.revision="${{ github.sha }}" \
              -Dsonar.pullrequest.key="${{ github.event.pull_request.number }}" \
              -Dsonar.pullrequest.branch="${{ github.event.pull_request.head.ref }}" \
              -Dsonar.pullrequest.base="${{ github.event.pull_request.base.ref }}"
          else
            echo "Running SonarQube scan for branch main"
            sonar-scanner \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.scm.revision="${{ github.sha }}" \
              -Dsonar.branch.name="main"
          fi
