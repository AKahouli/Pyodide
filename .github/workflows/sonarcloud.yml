name: SonarCloud Analysis

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to scan"
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarscan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # --------------------------
      # Generate backend coverage
      # --------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: YellowStorm/back/package-lock.json

      - name: Install backend dependencies and run tests
        continue-on-error: true
        working-directory: YellowStorm/back
        env:
          # ts-jest + v8 coverage over a large NestJS suite exceeds Node's
          # default ~2GB heap during the coverage merge; raise the ceiling.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm test -- --ci --forceExit --detectOpenHandles --coverage --coverageProvider=v8
      # --------------------------
      # SonarCloud full scan
      # --------------------------
      - name: Run SonarCloud Scan (full — manual dispatch)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ inputs.branch }}
            -Dsonar.newCode.definition=NUMBER_OF_DAYS
            -Dsonar.newCode.numberOfDays=365
