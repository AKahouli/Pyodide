name: worky-adk-runtime-dev

services:
  worky-adk-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: worky-adk-runtime
    container_name: worky-adk-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8011"
      BACKEND_BASE_URL: "http://yellowstorm-back:3000"
      LOG_LEVEL: "INFO"
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json, sys; r=urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=3); body=json.loads(r.read()); sys.exit(0 if body.get('status')=='ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
