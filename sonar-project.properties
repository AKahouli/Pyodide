sonar.projectKey=YellowsysOrg_YellowStorm-poc
sonar.projectName=YellowStorm-poc
sonar.host.url=https://sonar.yellowmind.ai

# Source — front and back
sonar.sources=YellowStorm/front/src,YellowStorm/back/src

# Exclude test files, generated files, and build artefacts
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.d.ts,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**

# Test files (tagged separately — not counted as source LOC)
sonar.tests=YellowStorm/front/src,YellowStorm/back/src
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.sourceEncoding=UTF-8