sonar.projectKey=YellowsysOrg_YellowStorm-poc
sonar.projectName=YellowStorm-poc
sonar.host.url=https://sonar.yellowmind.ai

# Source — front, back, and adk
sonar.sources=YellowStorm/front/src,YellowStorm/back/src,yellowstorm-adk/src

# Exclude test files, generated files, and build artefacts
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.d.ts,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.scannerwork/**,\
  **/__pycache__/**,\
  **/*.pyc,\
  yellowstorm-adk/src/grpc_generated/**

# Test files (tagged separately — not counted as source LOC)
sonar.tests=YellowStorm/front/src,YellowStorm/back/src,yellowstorm-adk/tests
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.py

# Coverage Report Paths
sonar.javascript.lcov.reportPaths=YellowStorm/front/coverage/lcov.info,YellowStorm/back/coverage/lcov.info
sonar.python.coverage.reportPaths=yellowstorm-adk/coverage.xml

sonar.sourceEncoding=UTF-8