# ============================================
# SonarCloud Configuration for YellowStorm-poc
# ============================================
sonar.organization=yellowsysorg-1
sonar.projectKey=YellowsysOrg_YellowStorm-poc

# Long-lived branches
sonar.branch.longLivedBranches.regex=(main|master|develop|(branch|release)-.*)

sonar.sources=YellowStorm/back/src,YellowStorm/front/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts

# Coverage — backend TypeScript only
sonar.javascript.lcov.reportPaths=YellowStorm/back/coverage/lcov.info
sonar.coverage.exclusions=YellowStorm/back/src/**/*.spec.ts,YellowStorm/back/src/**/*.test.ts,YellowStorm/front/src/**/*.test.ts,YellowStorm/front/src/**/*.test.tsx
