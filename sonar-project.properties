# ============================================
# SonarCloud Configuration for YellowStorm-poc
# ============================================
sonar.organization=yellowsysorg-1
sonar.projectKey=YellowsysOrg_YellowStorm-poc
sonar.projectName=YellowStorm-poc

# Source — front and back only
sonar.sources=YellowStorm/front/src,YellowStorm/back/src

# Test files declared separately so they are not counted as source LOC
sonar.tests=YellowStorm/front/src,YellowStorm/back/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclude generated, compiled, and test artefacts from source LOC
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.d.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage
sonar.javascript.lcov.reportPaths=YellowStorm/back/coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8
