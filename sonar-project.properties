# ============================================
# SonarCloud Configuration for YellowStorm-poc
# ============================================
sonar.organization=yellowsysorg-1
sonar.projectKey=YellowsysOrg_YellowStorm-poc

# Long-lived branches
sonar.branch.longLivedBranches.regex=(main|master|develop|(branch|release)-.*)

sonar.sources=YellowStorm/back/src,yellowstorm-adk/src,yellowstorm-adk/grpc,YellowStorm/front/src
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/*.pyc,**/migrations/**,**/.pytest_cache/**,**/.github/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,yellowstorm-adk/src/grpc_generated/**

# Coverage — Python only (TypeScript coverage blocked by babel-plugin-istanbul incompatibility)
sonar.python.coverage.reportPaths=yellowstorm-adk/coverage.xml
sonar.javascript.lcov.reportPaths=YellowStorm/back/coverage/lcov.info
sonar.coverage.exclusions=yellowstorm-adk/tests/**,yellowstorm-adk/src/grpc_generated/**,YellowStorm/back/src/**/*.spec.ts,YellowStorm/back/src/**/*.test.ts
